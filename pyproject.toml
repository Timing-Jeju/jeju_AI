[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jeju-day-trip-mcp"
version = "0.7.0"
description = "Evidence-grounded 제주 전역 하루 여행 생성·판정 MCP server"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "langgraph>=0.6,<2",
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "psycopg[binary]>=3.2,<4",
  "pyproj>=3.7,<4",
  "pyshp>=2.3,<3",
  "pydantic>=2.11,<3",
  "shapely>=2.1,<3",
]

[project.scripts]
jeju-data = "jeju_trip.interfaces.cli:main"
jeju-trip-mcp = "jeju_trip.interfaces.mcp.server:main"
jeju-trip-mcp-codex = "jeju_trip.interfaces.mcp.codex_launcher:main"
jeju-trip-mcp-http = "jeju_trip.interfaces.mcp.http_launcher:main"

[dependency-groups]
dev = [
  "openpyxl>=3.1,<4",
  "pyright>=1.1.403",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]
importer = [
  "openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jeju_trip"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
