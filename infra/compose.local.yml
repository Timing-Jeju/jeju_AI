services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jeju_trip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jeju_trip"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - jeju-postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgis/postgis:16-3.4
    profiles: ["test"]
    environment:
      POSTGRES_DB: jeju_trip_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-test-only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jeju_trip_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: jeju-local-admin
      MINIO_ROOT_PASSWORD: jeju-local-password-change-me
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - jeju-minio:/data

  minio-test:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["test"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: jeju-test-admin
      MINIO_ROOT_PASSWORD: jeju-test-password-only
    ports:
      - "127.0.0.1:59010:9000"
      - "127.0.0.1:59011:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data

volumes:
  jeju-postgres:
  jeju-minio:
