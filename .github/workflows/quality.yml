name: Quality

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Offline quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Check Korean test descriptions
        run: uv run python scripts/check_korean_test_descriptions.py
      - name: Ruff
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
      - name: Offline tests
        run: uv run pytest

  isolated-integration:
    name: Isolated PostGIS and MinIO integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JEJU_TEST_ADMIN_DSN: postgresql://postgres:local-postgres-test-only@127.0.0.1:55433/jeju_trip_test
      JEJU_TEST_S3_ENDPOINT: http://127.0.0.1:59010
      JEJU_TEST_S3_ACCESS_KEY: jeju-test-admin
      JEJU_TEST_S3_SECRET_KEY: jeju-test-password-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Start ephemeral services
        run: uv run python scripts/start_ci_services.py
      - name: Run isolated live integration tests
        run: uv run pytest tests/integration -q -rs
      - name: Stop ephemeral services
        if: always()
        run: docker compose -f infra/compose.local.yml --profile test down
